[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenegen"
version = "0.1.0"
description = "Simulator-agnostic scene generation, synthetic data, and domain randomization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "jpapagno"}]

# The core package is stdlib-only and must import without any simulator
# installed (see ROADMAP.md design rule 1). Isaac Sim / Isaac Lab are
# installed separately and are only needed to actually launch a scene.

[project.scripts]
scenegen = "scenegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
